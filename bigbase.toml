version = 1
framework = "static"

[build]
# BigBase: exec sem shell — use um único `npm run` (ver docs/DEPLOY.md).
command = "npm run build:bigbase"
output = "build"

# Obrigatório no schema do manifest; sites estáticos são servidos pelo FileServer.
[start]
command = "true"
port = 8080

# O proxy do BigBase usa connect-src 'self'. Sem isto o browser bloqueia
# a sessão e a leitura do livro, e a página fica em Carregando.
[security]
csp = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com; connect-src 'self' https://ep-lucky-dawn-bbvltogw.neonauth.c-15.us-east-1.aws.neon.tech https://br-shy-water-bbqc6npc-leitura.compute.c-15.us-east-1.aws.neon.tech https://br-shy-water-bbqc6npc-escrita.compute.c-15.us-east-1.aws.neon.tech; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; frame-ancestors 'none'"

[env]
VITE_BIGBASE_URL = "https://big-caixa.bigbase.click"
VITE_NEON_AUTH_URL = "https://ep-lucky-dawn-bbvltogw.neonauth.c-15.us-east-1.aws.neon.tech/neondb/auth"
VITE_CAIXA_URL = "https://br-shy-water-bbqc6npc-leitura.compute.c-15.us-east-1.aws.neon.tech"
VITE_CAIXA_ESCRITA_URL = "https://br-shy-water-bbqc6npc-escrita.compute.c-15.us-east-1.aws.neon.tech"