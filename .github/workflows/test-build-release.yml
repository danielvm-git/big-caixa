name: Test Build Release
# version: 3.0.1 — see workflow-templates/CHANGELOG.md
# Copy to .github/workflows/test-build-release.yml and pair with deploy-static.yml → deploy.yml

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_TYPE: static
  SITE_URL: 'https://big-caixa.bigbase.click'

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight
        run: |
          if [ -f scripts/preflight.sh ]; then
            bash scripts/preflight.sh
          elif [ -f Makefile ] && grep -q '^preflight:' Makefile; then
            make preflight
          elif command -v npm >/dev/null 2>&1 && grep -q '"preflight"' package.json 2>/dev/null; then
            npm run preflight
          else
            echo "WARN: No preflight script found — add scripts/preflight.sh"
          fi

      - name: Check Conventional Commits
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          git log origin/main..HEAD --oneline | while read -r line; do
            if ! echo "$line" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: "; then
              echo "FAIL: Non-conventional commit: $line"
              exit 1
            fi
          done
          echo "PASS: All commits follow Conventional Commits"

      - name: Check no AI agent attribution
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          if git log origin/main..HEAD --format="%B" | grep -qiE '^co[- ]authored[- ]by:'; then
            echo "FAIL: Co-authored-by: footer found — blocked by CONVENTIONS.md"
            exit 1
          fi
          echo "PASS: No AI agent attribution"

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Test
        run: npm test --if-present

  build:
    needs: [test]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BIGBASE_URL: ${{ env.SITE_URL }}
          # Pública; deve bater com bigbase.toml [env] para o build no BigBase
          VITE_NEON_AUTH_URL: https://ep-lucky-dawn-bbvltogw.neonauth.c-15.us-east-1.aws.neon.tech/neondb/auth

      - name: Write deploy-meta
        run: |
          jq -n \
            --arg sha "${{ github.sha }}" \
            --arg ref "${{ github.ref_name }}" \
            --arg app_type "${{ env.APP_TYPE }}" \
            '{sha: $sha, ref: $ref, app_type: $app_type}' > deploy-meta.json

      - name: Upload deploy-meta artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-meta
          path: deploy-meta.json
          retention-days: 3

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install big-release
        env:
          BIG_RELEASE_VERSION: '2.8.1'
          BIG_RELEASE_SHA256: 'af1ea3817e43b46d2677456e5863d8c18ae9a1976a7e836823b635a35e974656'
        run: |
          curl -sSfLO "https://github.com/danielvm-git/big-release/releases/download/${BIG_RELEASE_VERSION}/big-release-linux-amd64"
          echo "${BIG_RELEASE_SHA256}  big-release-linux-amd64" | sha256sum -c -
          chmod +x big-release-linux-amd64
          sudo mv big-release-linux-amd64 /usr/local/bin/big-release
          big-release --version

      - name: Run big-release
        run: big-release release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: big-release-bot
          GIT_AUTHOR_EMAIL: big-release-bot@danielvm-git.github.io
          GIT_COMMITTER_NAME: big-release-bot
          GIT_COMMITTER_EMAIL: big-release-bot@danielvm-git.github.io

  # Deploy só após build verde na main (sem workflow_run — evita workflow Deploy "skipped" quando o CI falha).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Download deploy-meta artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-meta
          path: deploy-meta

      - name: Verify deploy-meta artifact
        id: meta
        run: |
          if [ ! -s deploy-meta/deploy-meta.json ]; then
            echo "::error::deploy-meta artifact missing or empty"
            exit 1
          fi
          REF=$(jq -r '.sha' deploy-meta/deploy-meta.json)
          APP_TYPE=$(jq -r '.app_type' deploy-meta/deploy-meta.json)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "app_type=$APP_TYPE" >> "$GITHUB_OUTPUT"
          echo "Deploy metadata: $(cat deploy-meta/deploy-meta.json)"

      - name: Deploy to BigBase
        uses: danielvm-git/.github/actions/bigbase-deploy@9c56ac10c629f3baa110ddb19136579e3c90d690 # v1
        with:
          site_id: ${{ secrets.BIGBASE_SITE_ID }}
          app_type: ${{ steps.meta.outputs.app_type }}
          site_url: ${{ env.SITE_URL }}
          deploy_token: ${{ secrets.BIGBASE_DEPLOY_TOKEN }}
          ref: ${{ steps.meta.outputs.ref }}
          branch: main
          passthrough_paths: '["/api"]'
          skip_health_check: true

      - name: Health check (HTTP + health.json sha)
        env:
          EXPECTED_SHA: ${{ steps.meta.outputs.ref }}
        run: |
          SITE="${{ env.SITE_URL }}"
          ATTEMPTS=24
          INTERVAL=15
          for i in $(seq 1 "$ATTEMPTS"); do
            STATUS=$(curl -s -o /tmp/hc-body -w '%{http_code}' "${SITE}/health.json" || echo "000")
            if [ "$STATUS" = "200" ]; then
              ACTUAL=$(jq -r '.sha // empty' /tmp/hc-body)
              if [ -n "$ACTUAL" ] && { [ "$ACTUAL" = "$EXPECTED_SHA" ] || [ "${ACTUAL:0:7}" = "${EXPECTED_SHA:0:7}" ]; }; then
                echo "Site LIVE — health.json sha matches deploy ref (${EXPECTED_SHA:0:7})"
                jq . /tmp/hc-body
                exit 0
              fi
              echo "Attempt $i/$ATTEMPTS: HTTP 200 but sha=$ACTUAL (want ${EXPECTED_SHA:0:7}), BigBase may still be building..."
            else
              echo "Attempt $i/$ATTEMPTS: /health.json HTTP $STATUS, waiting ${INTERVAL}s..."
            fi
            sleep "$INTERVAL"
          done
          echo "::error::Production health.json never matched ref ${EXPECTED_SHA} (build may have failed on BigBase host)"
          exit 1
